# Re:VIEW 設定ファイル
# review-pdfmaker / review-epubmaker から参照される。
# 全パラメータの一覧は review-docs/config.yml.sample 相当（公式リポジトリ）を参照。

# サポートするRe:VIEWのバージョン
review_version: 5.0

# ブック名（生成物のファイル名になる。ASCII範囲の文字を使う）
bookname: sauna-entry-book

# 記述言語
language: ja

# 書名。判断の記録は notes/title-ideas.md
booktitle: サウナ駆動開発

# サブタイトル。大扉・奥付・EPUBの表紙に出る
subtitle: エンジニアのためのサウナ入門

# 著者名。「, 」区切りで複数指定できる
aut: ["Ken.T"]

# 刊行日（TODO: 技術書典21の開催日に合わせて更新する）
date: 2026-11-01
history: [["2026-11-01"]]

# 権利表記
rights: (C) 2026 Ken.T

# 目次に載せる見出しレベル（=、==、=== の3階層まで）
toclevel: 3
# 採番する見出しレベル（== まで番号を振る）
secnolevel: 2
# 目次を作る
toc: true

# 原稿ディレクトリ。.re ファイルはすべてここに置く
contentdir: contents

# EPUB用スタイルシート
stylesheet: ["style.css"]

# 表紙画像。EPUB（電子版）の表紙に使う（現状は仮版）。
# 差し替えるときは images/ 直下のファイルを置き換えて、この行の拡張子を合わせる。
# ファイルが無い状態でこの行を有効にすると review-epubmaker が落ちる。
coverimage: cover.png

epubmaker:
  htmlext: xhtml

# PDF（LaTeX）出力設定
texstyle: ["reviewmacro"]
# A5判・印刷用（トンボあり）。電子版を出すときは media=ebook に変える
# 判型を変えるときは paper= を差し替える（a5 / b6 / a6 など。詳細は sty/README.md）
texdocumentclass: ["review-jsbook", "media=print,paper=a5"]

pdfmaker:
  # 入稿用の表紙PDF/AIは別データで作るため、本文PDFには表紙を入れない
  # coverimage: cover-a5.ai
  # 奥付を出力する
  colophon: true
